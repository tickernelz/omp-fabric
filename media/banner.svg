<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 1200 310" width="1200" height="310">
  <title>omp-fabric — one checked TypeScript program weaving OMP core tools, MCP servers, agents, and mesh into a single result</title>
  <defs>
    <pattern id="warp" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="110" width="1200" height="310" rx="14" fill="#0d1117"/>
  <rect x="0" y="110" width="1200" height="310" rx="14" fill="url(#warp)" opacity="0.45"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.4s" begin="0.35s" fill="freeze"/>
    <rect x="40" y="206" width="192" height="52" rx="12" fill="#21262d" stroke="#30363d"/>
    <polygon points="232,222 254,232 232,242" fill="#21262d" stroke="#30363d"/>
    <line x1="232" y1="222.5" x2="232" y2="241.5" stroke="#21262d" stroke-width="3"/>
    <text x="56" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-style="italic" fill="#c9d1d9">&#8220;migrate auth to</text>
    <text x="56" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-style="italic" fill="#c9d1d9">webauthn&#8221;</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.5s" begin="0.55s" fill="freeze"/>
    <rect x="270" y="150" width="380" height="186" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="288" cy="170" r="4" fill="#ff5f57" opacity="0.8"/>
    <circle cx="304" cy="170" r="4" fill="#febc2e" opacity="0.8"/>
    <circle cx="320" cy="170" r="4" fill="#28c840" opacity="0.8"/>
    <text x="336" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">fabric_exec · agent program</text>
  </g>

  <text x="292" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="0.85s" fill="freeze"/><tspan fill="#ff7b72">const</tspan><tspan> [man, srcs] = </tspan><tspan fill="#ff7b72">await</tspan><tspan> Promise.all([</tspan>
  </text>
  <text x="308" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.17s" fill="freeze"/><tspan>omp.read({ path: </tspan><tspan fill="#a5d6ff">"package.json"</tspan><tspan> }),</tspan>
  </text>
  <text x="308" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.49s" fill="freeze"/><tspan>omp.find({ pattern: </tspan><tspan fill="#a5d6ff">"src/**/*.ts"</tspan><tspan> }),</tspan>
  </text>
  <text x="292" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.81s" fill="freeze"/><tspan>]);</tspan>
  </text>
  <text x="292" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.13s" fill="freeze"/><tspan fill="#ff7b72">return</tspan><tspan> { files: srcs.length };</tspan>
  </text>
  <rect x="536" y="297" width="8" height="15" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.5;0.55;1" dur="1.1s" begin="2.5s" repeatCount="indefinite"/>
  </rect>

  <path id="t1" d="M 650 176 C 770 176, 810 140, 938 140" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="1.3s" fill="freeze"/>
  </path>
  <path id="t2" d="M 650 208 C 770 208, 810 190, 938 190" fill="none" stroke="#d2a8ff" stroke-width="1.5" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="1.42s" fill="freeze"/>
  </path>
  <path id="t3" d="M 650 240 C 770 240, 810 240, 938 240" fill="none" stroke="#f778ba" stroke-width="1.5" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="1.54s" fill="freeze"/>
  </path>
  <path id="t4" d="M 650 272 C 770 272, 810 290, 938 290" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="1.66s" fill="freeze"/>
  </path>
  <path id="t5" d="M 650 304 C 770 304, 810 340, 938 340" fill="none" stroke="#e3b341" stroke-width="1.5" opacity="0.85" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="1.78s" fill="freeze"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.4s" begin="1.9s" fill="freeze"/>
    <rect x="938" y="122" width="216" height="36" rx="18" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.45"/>
    <circle cx="960" cy="140" r="5" fill="#58a6ff"/>
    <text x="978" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3"><tspan fill="#58a6ff">omp.*</tspan><tspan dx="8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">core tools</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.03s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.4s" begin="2.03s" fill="freeze"/>
    <rect x="938" y="172" width="216" height="36" rx="18" fill="#161b22" stroke="#d2a8ff" stroke-opacity="0.45"/>
    <circle cx="960" cy="190" r="5" fill="#d2a8ff"/>
    <text x="978" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3"><tspan fill="#d2a8ff">mcp.*</tspan><tspan dx="8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">servers</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.16s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.4s" begin="2.16s" fill="freeze"/>
    <rect x="938" y="222" width="216" height="36" rx="18" fill="#161b22" stroke="#f778ba" stroke-opacity="0.45"/>
    <circle cx="960" cy="240" r="5" fill="#f778ba"/>
    <text x="978" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3"><tspan fill="#f778ba">agents</tspan><tspan dx="8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">+ actors</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.29s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.4s" begin="2.29s" fill="freeze"/>
    <rect x="938" y="272" width="216" height="36" rx="18" fill="#161b22" stroke="#3fb950" stroke-opacity="0.45"/>
    <circle cx="960" cy="290" r="5" fill="#3fb950"/>
    <text x="978" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3"><tspan fill="#3fb950">mesh</tspan><tspan dx="8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">state + tasks</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.42s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 4" to="0 0" dur="0.4s" begin="2.42s" fill="freeze"/>
    <rect x="938" y="322" width="216" height="36" rx="18" fill="#161b22" stroke="#e3b341" stroke-opacity="0.45"/>
    <circle cx="960" cy="340" r="5" fill="#e3b341"/>
    <text x="978" y="345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3"><tspan fill="#e3b341">workflow</tspan><tspan dx="8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">phases</tspan></text>
  </g>

  <g filter="url(#glow)">
    <circle r="3.5" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.4s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="2.4s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#d2a8ff" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.8s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="2.8s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#f778ba" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.2s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="3.2s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.6s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="3.6s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#e3b341" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.0s" fill="freeze"/>
      <animateMotion dur="2.4s" begin="4.0s" repeatCount="indefinite"><mpath href="#t5"/></animateMotion>
    </circle>
    <circle r="3" fill="#8b949e" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.2s" fill="freeze"/>
      <animateMotion dur="3.4s" begin="3.2s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion>
    </circle>
  </g>

  <path id="rt" d="M 1046 360 C 870 388, 620 390, 484 342" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="2 7" opacity="0" marker-end="url(#arrow)">
    <animate attributeName="opacity" from="0" to="0.85" dur="0.6s" begin="2.6s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="9" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="412" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6e7681" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.7s" fill="freeze"/>one checked program in · one result out — branches, fan-out, and coordination stay in the sandbox
  </text>
</svg>
