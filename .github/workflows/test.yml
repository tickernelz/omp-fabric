name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Keyed by commit, since a release gate reads the run for the tagged SHA.
  # A branch key would cancel that run as soon as the next commit landed.
  group: test-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install ripgrep
        # OMP's grep tool downloads rg on first use when it is absent; on shared
        # runners that ad-hoc GitHub Releases download is rate-limited, so
        # provision rg on PATH up front to keep nested-grep tests hermetic.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get install -y ripgrep
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Typecheck, build, and dead-code lint describe the tree rather than a
      # shard of it, so one shard per OS carries them.
      - name: Type check
        if: matrix.shard == 1
        run: bun run typecheck
      - name: Test Windows type-checker regression
        if: matrix.shard == 1 && runner.os == 'Windows'
        run: bun --bun node_modules/vitest/vitest.mjs run tests/type-checker.test.ts
      - name: Build
        if: matrix.shard == 1
        run: bun run build
      - name: Lint (dead code)
        if: matrix.shard == 1
        run: bun run lint:dead
      - name: Test
        run: bun run test -- --shard=${{ matrix.shard }}/2
