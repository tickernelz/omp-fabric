name: Entropy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Certify entropy
        run: bun scripts/certify-entropy.mjs --json entropy-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entropy-report
          path: entropy-report.json
