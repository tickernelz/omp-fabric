name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tagged commit is already on main, where Test runs the full matrix.
      # Waiting for that result keeps the Windows guarantee without paying for
      # a second full run of the same commit.
      - name: Require a green Test run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1800 ))
          while :; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml \
              --commit "$GITHUB_SHA" --limit 1 --json conclusion,status \
              --jq '.[0] | select(.status == "completed") | .conclusion')"
            case "$conclusion" in
              success) echo "Test passed for $GITHUB_SHA"; break ;;
              "") if [ "$SECONDS" -ge "$deadline" ]; then
                    echo "no completed Test run for $GITHUB_SHA after 30 minutes" >&2
                    exit 1
                  fi
                  sleep 20 ;;
              *) echo "Test concluded $conclusion for $GITHUB_SHA" >&2; exit 1 ;;
            esac
          done
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify the tag matches this package
        # Inherited upstream tags also match `v*`; pinning the name stops one of
        # them from publishing a different package under this workflow.
        run: |
          name="$(node -p 'require("./package.json").name')"
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$name" != "omp-fabric" ]; then
            echo "refusing to publish package $name" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Build the published artifact
        run: bun run build
      - name: Publish to npm
        # dist/ is built above and the tree is gated by Test, so publishing
        # without lifecycle scripts avoids a third full run of the same checks.
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
